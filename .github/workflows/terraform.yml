name: Terraform module checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['aks-v*', 'network-v*', 'node-pool-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform: ['1.9.8', '1.15.2']
        module: [network, aks, node-pool]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=${{ matrix.module }} init -backend=false
      - run: terraform -chdir=${{ matrix.module }} validate
      - run: terraform -chdir=${{ matrix.module }} test
      - name: Validate examples
        env:
          MODULE: ${{ matrix.module }}
        run: |
          for example in "$MODULE"/examples/*; do
            terraform -chdir="$example" init -backend=false
            terraform -chdir="$example" validate
          done
